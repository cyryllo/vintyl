[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vintyl"
version = "0.9.0"
description = "Software for vinyl cutters"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Vintyl contributors" }]
# The core needs no GUI toolkit; pyserial is only imported when sending to a port.
dependencies = ["pyserial>=3.5", "pyclipper>=1.3"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6", "svgelements>=1.9", "segno>=1.5"]
dev = ["pytest>=8", "babel>=2.14"]

[project.gui-scripts]
vintyl = "vintyl.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vintyl.core" = ["profiles/*.toml", "materials/*.toml"]
"vintyl.gui" = ["icons/*.svg", "icons/*.png", "icons/tabler/*.svg", "icons/tabler/LICENSE"]
"vintyl" = ["locale/*/LC_MESSAGES/*.mo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
