# Vintyl as a Flatpak: build it with
#   flatpak-builder --user --install --force-clean build/flatpak packaging/flatpak/io.github.cyryllo.Vintyl.yml
# or a single file to hand out (the release workflow does this):
#   flatpak build-bundle <repo> Vintyl.flatpak io.github.cyryllo.Vintyl
#
# PySide6 (Qt for Python) comes from Flathub's PySide base app, on the KDE
# runtime of the same Qt version. The cutter is a device file
# (/dev/usb/lp0, /dev/ttyUSB0...): --device=all gives the sandbox the host's
# /dev (Flathub takes no narrower USB permission); the user must still be in
# the group that may use it (lp, dialout), as without Flatpak.
#
# Copyright (C) 2026 Vintyl contributors
# Licensed under the GNU General Public License v3 or later. See LICENSE.
id: io.github.cyryllo.Vintyl
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: vintyl
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # the cutter: /dev/usb/lp*, /dev/ttyUSB*, /dev/ttyACM*
  - --device=all
  # Help → Check for updates asks GitHub for the newest release
  - --share=network
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
    - BASEAPP_DISABLE_NUMPY=1
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - name: python-libraries
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
        pyserial pyclipper svgelements segno
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/07/bc/587a445451b253b285629263eb51c2d8e9bcea4fc97826266d186f96f558/pyserial-3.5-py2.py3-none-any.whl
        sha256: c4451db6ba391ca6ca299fb3ec7bae67a5c55dde170964c7a14ceefec02f2cf0
      # pyclipper is C++: its built wheel for the runtime's Python 3.13
      - type: file
        url: https://files.pythonhosted.org/packages/db/48/dd301d62c1529efdd721b47b9e5fb52120fcdac5f4d3405cfc0d2f391414/pyclipper-1.4.0-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: 14c8bdb5a72004b721c4e6f448d2c2262d74a7f0c9e3076aeff41e564a92389f
      - type: file
        url: https://files.pythonhosted.org/packages/48/2c/6c9bb53db56c8a12a736d2158a8b842a5993b96daabc29d90a098e840280/svgelements-1.9.6-py2.py3-none-any.whl
        sha256: 8a5cf2cc066d98e713d5b875b1d6e5eeb9b92e855e835ebd7caab2713ae1dcad
      - type: file
        url: https://files.pythonhosted.org/packages/d6/02/12c73fd423eb9577b97fc1924966b929eff7074ae6b2e15dd3d30cb9e4ae/segno-1.6.6-py3-none-any.whl
        sha256: 28c7d081ed0cf935e0411293a465efd4d500704072cdb039778a2ab8736190c7

  - name: vintyl
    buildsystem: simple
    build-commands:
      # the program (PySide6 is the base app's, so no dependencies from pip)
      - pip3 install --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 packaging/flatpak/io.github.cyryllo.Vintyl.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/io.github.cyryllo.Vintyl.metainfo.xml
      - install -Dm644 packaging/linux/vintyl.desktop ${FLATPAK_DEST}/share/applications/io.github.cyryllo.Vintyl.desktop
      - desktop-file-edit --set-icon=io.github.cyryllo.Vintyl
        ${FLATPAK_DEST}/share/applications/io.github.cyryllo.Vintyl.desktop
      - install -Dm644 packaging/linux/vintyl-mime.xml ${FLATPAK_DEST}/share/mime/packages/io.github.cyryllo.Vintyl.xml
      # the icon as PNG in every size (appstreamcli compose cannot read the SVG one)
      - for s in 16 32 48 64 128 256 512; do install -Dm644 assets/ikona/vintyl-$s.png
        ${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps/io.github.cyryllo.Vintyl.png; done
    sources:
      - type: dir
        path: ../..
