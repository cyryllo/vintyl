# Build the Linux AppImage on Ubuntu 22.04 (older glibc: it also runs on
# older systems), check it with --self-test, and on a version tag (vX.Y.Z,
# or a pre-release such as v0.1.0a1) publish it as a GitHub release with the
# notes of that version from CHANGELOG.md. A tag with a, b or rc in it is
# published as a pre-release.
# To try the AppImage without a release: Actions -> packages -> Run workflow
# (the file is kept as a workflow artifact).
# After Kerfly's .github/workflows/release.yml (commit cf48565).
name: packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install ".[gui]" pyinstaller
      - name: appimagetool
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: AppImage
        env:
          PYTHON: python
          APPIMAGETOOL: ./appimagetool
        run: packaging/linux/build-appimage.sh
      - name: Self-test of the AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x dist/*.AppImage
          dist/Vintyl-*-x86_64.AppImage --appimage-extract-and-run --self-test
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/Vintyl-*-x86_64.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Notes from CHANGELOG.md
        id: notes
        run: |
          python3 tools/release_notes.py "${GITHUB_REF_NAME}" > notes.md
          echo "title=Vintyl ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          files: packages/*
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
