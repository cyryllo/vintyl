# Build the Linux AppImage and the .deb package on Ubuntu 22.04 (older glibc:
# they also run on older systems) and the Flatpak in Flathub's builder, check
# each with --self-test, and on a version tag (vX.Y.Z, or a pre-release such
# as v0.1.0a1) publish them as a GitHub release with the notes of that
# version from CHANGELOG.md. A tag with a, b or rc in it is
# published as a pre-release.
# To try the AppImage without a release: Actions -> packages -> Run workflow
# (the file is kept as a workflow artifact).
# After Kerfly's .github/workflows/release.yml (commit cf48565).
name: packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install ".[gui]" pyinstaller
      - name: appimagetool
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: AppImage
        env:
          PYTHON: python
          APPIMAGETOOL: ./appimagetool
        run: packaging/linux/build-appimage.sh
      - name: Self-test of the AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x dist/*.AppImage
          dist/Vintyl-*-x86_64.AppImage --appimage-extract-and-run --self-test
      - name: .deb package (the same program)
        env:
          PYTHON: python
        run: packaging/linux/build-deb.sh
      - name: Self-test of the installed .deb
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y ./dist/vintyl_*_amd64.deb
          vintyl --self-test
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/Vintyl-*-x86_64.AppImage
            dist/vintyl_*_amd64.deb
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: Flatpak
        run: packaging/flatpak/build-flatpak.sh
      - name: Self-test of the Flatpak
        run: |
          flatpak install -y --noninteractive dist/Vintyl-*-x86_64.flatpak
          flatpak run --env=QT_QPA_PLATFORM=offscreen io.github.cyryllo.Vintyl --self-test
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: dist/Vintyl-*-x86_64.flatpak
          if-no-files-found: error

  release:
    # the AppImage and the .deb are needed; the Flatpak goes along when it was built
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.linux.result == 'success'
    needs: [linux, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Notes from CHANGELOG.md
        id: notes
        run: |
          python3 tools/release_notes.py "${GITHUB_REF_NAME}" > notes.md
          echo "title=Vintyl ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          files: packages/*
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
