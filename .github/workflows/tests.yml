# Vintyl's tests on a clean Linux machine after every push (as Kerfly's
# tests.yml, for Linux only): install it the way a developer does, run the
# self-test, all the tests (the window ones offscreen) and the translations'
# check. Nothing here talks to a cutter.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the oldest Python Vintyl takes (pyproject.toml) and a recent one
        python-version: ["3.11", "3.13"]
    name: linux (Python ${{ matrix.python-version }})
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries for Qt
        run: |
          .github/scripts/apt-install.sh --no-install-recommends libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Install Vintyl with the window and the test tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[gui,dev]'
      - name: Self-test
        if: always()
        run: .venv/bin/python -m vintyl --self-test
      - name: Tests
        if: always()
        run: .venv/bin/python -X faulthandler -m pytest -q
      - name: Translations
        if: always()
        run: .venv/bin/python tools/i18n.py --check
