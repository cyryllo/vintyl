<?xml version="1.0" encoding="UTF-8"?>
<!-- Propozycja B „Nóż”: jak w Kerfly, gdzie ramię K jest promieniem lasera.
     Tu prawe ramię V to oprawka noża wleczonego, a lewe to pasek folii,
     który nóż właśnie wyciął (biała linia cięcia). Kropkowany okrąg przy
     ostrzu to przesunięcie ostrza względem osi (kompensacja noża). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3756"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="vinyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f45ba3"/>
      <stop offset="1" stop-color="#c2256f"/>
    </linearGradient>
    <!-- metal oprawki: walec, jasny pas przy lewej krawędzi -->
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa4b4"/>
      <stop offset="0.3" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#8790a1"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9edf3"/>
      <stop offset="1" stop-color="#9ea8b8"/>
    </linearGradient>
  </defs>

  <!-- tło -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="106.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- lewe ramię: wycięty pasek folii z linią cięcia, kończy się przy ostrzu -->
  <path d="M150 150 L256 368" fill="none" stroke="#0b1020" stroke-opacity="0.55"
        stroke-width="90" stroke-linecap="round" transform="translate(0 6)"/>
  <path d="M150 150 L256 368" fill="none" stroke="#f8fafc" stroke-width="86" stroke-linecap="round"/>
  <path d="M150 150 L256 368" fill="none" stroke="url(#vinyl)" stroke-width="72" stroke-linecap="round"/>

  <!-- prawe ramię: oprawka noża ustawiona wzdłuż ramienia V, ostrze w dole litery.
       Układ lokalny: oś oprawki pionowo w x=362, od y=118 (góra) w dół. -->
  <g transform="rotate(25.9 362 150)">
    <rect x="328" y="112" width="68" height="200" rx="18" fill="#0b1020" fill-opacity="0.5" transform="translate(5 8)"/>
    <rect x="328" y="112" width="68" height="200" rx="18" fill="url(#steel)"/>
    <!-- pierścień regulacji wysunięcia ostrza -->
    <rect x="324" y="262" width="76" height="20" rx="6" fill="#5b6576"/>
    <!-- stożek prowadzący i ostrze 45° -->
    <path d="M336 312 L388 312 L372 346 L352 346 Z" fill="#c8cfda"/>
    <path d="M356 346 L370 346 L364 388 Z" fill="url(#blade)" stroke="#4b5563" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- przesunięcie ostrza: kropkowany okrąg wokół czubka -->
  <circle cx="256" cy="368" r="30" fill="none" stroke="#5be37f" stroke-width="7"
          stroke-dasharray="2 12" stroke-linecap="round"/>
</svg>
