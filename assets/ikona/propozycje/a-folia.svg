<?xml version="1.0" encoding="UTF-8"?>
<!-- Propozycja A „Folia”: litera V wycięta w kolorowej folii. Biała linia to
     cięcie noża wokół litery, a górny koniec prawego ramienia jest już
     podnoszony (obieranie folii z podkładu). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3756"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="vinyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f45ba3"/>
      <stop offset="1" stop-color="#c2256f"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dee7"/>
    </linearGradient>
  </defs>

  <!-- tło -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="106.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- cień litery -->
  <path d="M150 150 L256 368 L333 209" fill="none" stroke="#0b1020" stroke-opacity="0.55"
        stroke-width="90" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 6)"/>
  <!-- linia cięcia wokół litery -->
  <path d="M150 150 L256 368 L333 209" fill="none" stroke="#f8fafc"
        stroke-width="86" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- folia -->
  <path d="M150 150 L256 368 L333 209" fill="none" stroke="url(#vinyl)"
        stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tam, gdzie folię już podniesiono, zostaje tylko kreskowany ślad cięcia -->
  <path d="M333 209 L362 150" fill="none" stroke="#f8fafc" stroke-opacity="0.55"
        stroke-width="5" stroke-dasharray="10 9" stroke-linecap="round"
        transform="translate(-39 -19)"/>
  <path d="M333 209 L362 150" fill="none" stroke="#f8fafc" stroke-opacity="0.55"
        stroke-width="5" stroke-dasharray="10 9" stroke-linecap="round"
        transform="translate(39 19)"/>
  <path d="M323 131 A 43 43 0 0 1 401 169" fill="none" stroke="#f8fafc" stroke-opacity="0.55"
        stroke-width="5" stroke-dasharray="10 9" stroke-linecap="round"/>
  <!-- podniesiony róg: wywinięty do tyłu, widać jasny spód folii -->
  <path d="M297 192 L369 226 Q 350 262 300 274 Q 290 232 297 192 Z" fill="#0b1020" fill-opacity="0.45" transform="translate(5 9)"/>
  <path d="M297 192 L369 226 Q 350 262 300 274 Q 290 232 297 192 Z" fill="url(#flap)"/>
  <path d="M297 192 L369 226" stroke="#c2256f" stroke-width="7" stroke-linecap="round"/>
</svg>
