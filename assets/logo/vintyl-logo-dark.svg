<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Vintyl — logo (ikona + napis), wersja dark. Plik tworzy tools/make_icons.sh. -->

<svg
   width="1400"
   height="400"
   viewBox="0 0 1400 400"
   version="1.1"
   id="svg17"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs17" />
  <g
     transform="translate(40 44) scale(0.61)"
     id="g16">
    <defs
       id="defs9">
      <linearGradient
         id="bg"
         x1="0"
         y1="0"
         x2="0"
         y2="1">
        <stop
           offset="0"
           stop-color="#2a3756"
           id="stop1" />
        <stop
           offset="1"
           stop-color="#111827"
           id="stop2" />
      </linearGradient>
      <linearGradient
         id="vinyl"
         x1="0"
         y1="0"
         x2="0"
         y2="1">
        <stop
           offset="0"
           stop-color="#f45ba3"
           id="stop3" />
        <stop
           offset="1"
           stop-color="#c2256f"
           id="stop4" />
      </linearGradient>
      <!-- metal oprawki: walec, jasny pas przy lewej krawędzi -->
      <linearGradient
         id="steel"
         x1="0"
         y1="0"
         x2="1"
         y2="0">
        <stop
           offset="0"
           stop-color="#9aa4b4"
           id="stop5" />
        <stop
           offset="0.3"
           stop-color="#f4f6fa"
           id="stop6" />
        <stop
           offset="1"
           stop-color="#8790a1"
           id="stop7" />
      </linearGradient>
      <linearGradient
         id="blade"
         x1="0"
         y1="0"
         x2="1"
         y2="0">
        <stop
           offset="0"
           stop-color="#e9edf3"
           id="stop8" />
        <stop
           offset="1"
           stop-color="#9ea8b8"
           id="stop9" />
      </linearGradient>
    </defs>
    <!-- tło -->
    <rect
       x="16"
       y="16"
       width="480"
       height="480"
       rx="108"
       fill="url(#bg)"
       id="rect9" />
    <rect
       x="17.5"
       y="17.5"
       width="477"
       height="477"
       rx="106.5"
       fill="none"
       stroke="#ffffff"
       stroke-opacity="0.08"
       stroke-width="3"
       id="rect10" />
    <!-- lewe ramię: wycięty pasek folii z linią cięcia, kończy się przy ostrzu -->
    <path
       d="M150 150 L256 368"
       fill="none"
       stroke="#0b1020"
       stroke-opacity="0.55"
       stroke-width="90"
       stroke-linecap="round"
       transform="translate(0 6)"
       id="path10" />
    <path
       d="M150 150 L256 368"
       fill="none"
       stroke="#f8fafc"
       stroke-width="86"
       stroke-linecap="round"
       id="path11" />
    <path
       d="M150 150 L256 368"
       fill="none"
       stroke="url(#vinyl)"
       stroke-width="72"
       stroke-linecap="round"
       id="path12" />
    <!-- prawe ramię: oprawka noża ustawiona wzdłuż ramienia V, ostrze w dole litery.
       Układ lokalny: oś oprawki pionowo w x=362, od y=118 (góra) w dół. -->
    <g
       transform="rotate(25.9 362 150)"
       id="g15">
      <rect
         x="328"
         y="112"
         width="68"
         height="200"
         rx="18"
         fill="#0b1020"
         fill-opacity="0.5"
         transform="translate(5 8)"
         id="rect12" />
      <rect
         x="328"
         y="112"
         width="68"
         height="200"
         rx="18"
         fill="url(#steel)"
         id="rect13" />
      <!-- pierścień regulacji wysunięcia ostrza -->
      <rect
         x="324"
         y="262"
         width="76"
         height="20"
         rx="6"
         fill="#5b6576"
         id="rect14" />
      <!-- stożek prowadzący i ostrze 45° -->
      <path
         d="M336 312 L388 312 L372 346 L352 346 Z"
         fill="#c8cfda"
         id="path14" />
      <path
         d="M356 346 L370 346 L364 388 Z"
         fill="url(#blade)"
         stroke="#4b5563"
         stroke-width="2.5"
         stroke-linejoin="round"
         id="path15" />
    </g>
    <!-- przesunięcie ostrza: kropkowany okrąg wokół czubka -->
    <circle
