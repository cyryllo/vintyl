# Seiki SK-870T (sold also as VEVOR 870).
# Manual: feeds up to 870 mm, cuts up to 780 mm; DMPL and HPGL; RS-232.
# Values marked "check" are first guesses until tested on the cutter.

name = "Seiki SK-870T"

width_mm = 780.0          # cutting width from the manual (870 mm is the feed)
length_mm = 0.0           # roll: no limit

connection = "serial"     # check: the manual says RS-232; it may be a USB printer like the KI-375A
port = "/dev/ttyUSB0"     # check
send_speed_force = false  # speed and force on the panel only (the owner, 16.11.2026)

baud = 9600               # check: set in the cutter's menu
flow = "none"             # check: a forum post used rtscts

language = "hpgl"         # check: CutScape uses DMPL mode 3 for the VEVOR KH-870
units_per_mm = 40.0       # check: Inkcut uses 40.2 (1021 per inch)

swap_xy = false           # check with the 20 mm test square and its X mark
invert_x = false
invert_y = false

knife_offset_mm = 0.25    # usual for a 45 degree blade
overcut_mm = 0.5

pacing = "none"           # check
