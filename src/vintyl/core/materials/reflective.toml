# Reflective vinyl: thicker than plain vinyl.
# Force: the big cutters 80 g, the small one 40 g; Stahls' CAD-CUT Reflective II
# gives 70-90 g at 30 cm/s for a Roland. Speed 300 mm/s.
# Per cutter (the owner, 17.11.2026): the small KI-375A presses hard and takes
# half; the big 870 mm cutters (Seiki SK-870T, VEVOR 870) need the full value;
# another model starts with the small one's (less force does not cut the backing).
name = "Reflective vinyl"
tool = "knife"
blade = "60"
# the 60 degree blade's offset (Roland's Cutter Blade Reference Guide, 2017:
# ZEC-U3050, 60 degrees / 0.50 mm offset, for reflective and thick materials)
knife_offset_mm = 0.5
weed_frame = true
note = "Starting values: check them with the knife test."

[per_cutter."seiki-sk-870t"]
force_g = 80
speed_cm_s = 30.0

[per_cutter."vevor-870"]
force_g = 80
speed_cm_s = 30.0

[per_cutter."vevor-ki-375a"]
force_g = 40
speed_cm_s = 30.0

[per_cutter."xili-usb"]
force_g = 40
speed_cm_s = 30.0
