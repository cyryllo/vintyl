# Vinyl film for signs and stickers.
# Force: the small cutter 50 g (the owner: 100 g was too much), the big ones 80 g
# (a Seiki SK-870T user, Morristown Makers 2020: 70-90 g); VEVOR's manual starts
# at 100 g. Speed 300 mm/s ("a reasonable default", VEVOR's manual).
# Per cutter (the owner, 17.11.2026): the small KI-375A presses hard and takes
# half; the big 870 mm cutters (Seiki SK-870T, VEVOR 870) need the full value;
# another model starts with the small one's (less force does not cut the backing).
name = "Vinyl film"
tool = "knife"
blade = "45"
weed_frame = true
note = "Starting values: check them with the knife test."

[per_cutter."seiki-sk-870t"]
force_g = 80
speed_cm_s = 30.0

[per_cutter."vevor-870"]
force_g = 80
speed_cm_s = 30.0

[per_cutter."vevor-ki-375a"]
force_g = 50
speed_cm_s = 30.0

[per_cutter."xili-usb"]
force_g = 50
speed_cm_s = 30.0
